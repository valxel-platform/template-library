version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }  # newly published versions wait a week (security updates do not)
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }  # newly published versions wait a week (security updates do not)
